{% set name = "imagepy" %}
{% set version = "0.20" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  fn: '{{ name }}-{{ version }}.tar.gz'
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f014aacae161a03b05e6897cde6d086dfc9a6c504ef12719c9ed8d007ffd5b64

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - scikit-image >=0.14.0
    - shapely >=1.0
    - wxpython >=4.0
    - numba >=0.29
    - pypubsub >=4.0
    - pandas >=0.23
    - xlrd >=1.1.0
    - xlwt >=1.3.0
    - openpyxl >=2.5.3
    - pydicom >=1.0
    - markdown >=2.6
    - numpy-stl >=2.7

test:
  requires:
    - python {{ python_min }}
  imports:
    - imagepy

about:
  home: https://github.com/Image-Py/imagepy
  license: BSD 3-clause
  license_family: BSD
  license_file: LICENSE
  summary: interactive python image-processing plugin framework
  description: |
    Image process framework based on plugin like imagej.
    It is easy to glue with any libraries based on numpy.
    Such as scipy.ndimage, scikit-image, opencv, simpleitk, mayavi...
  doc_url: 'https://github.com/Image-Py/imagepy'
  dev_url: 'https://github.com/Image-Py/imagepy'

extra:
  recipe-maintainers: 
    - yxdragon
